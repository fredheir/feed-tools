packages:
  - .

overrides:
  vite: ^8.0.16
  js-yaml: ">=4.2.0"
  nanoid: 3.3.12
  axios: ">=1.12.0"
  follow-redirects: ">=1.15.6"
  fast-uri: ">=3.1.2"
  brace-expansion: ">=5.0.6"
  esbuild: ^0.28.1

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@markolo-research/*"
  - "@markolo/*"
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080

onlyBuiltDependencies:
  - agent-browser
  - esbuild
  - slop-scan
