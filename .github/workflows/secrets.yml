name: secrets

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  MARKOLO_SHARED_STANDARDS_REF: 0e360fa45f96701eed10085161dc5bc653ba81a2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    env:
      SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure private Git auth
        run: scripts/ci/configure-private-github-git
        env:
          GH_PRIVATE_REPO_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Load shared repo standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Markolo-Research/markolo-shared
          ref: ${{ env.MARKOLO_SHARED_STANDARDS_REF }}
          path: .repo-standards/markolo-shared
          token: ${{ secrets.PACKAGES_TOKEN }}
          persist-credentials: false
      - name: Set shared repo standards path
        run: echo "REPO_STANDARDS_LOCAL=$GITHUB_WORKSPACE/.repo-standards/markolo-shared" >> "$GITHUB_ENV"
      - name: Install Safe Chain
        run: scripts/guards/_repo-standards safe-chain-install
      - name: Install Bun for git-hosted slop-scan
        run: |
          bun_target=1.3.13
          if [[ "$(bun --version 2>/dev/null)" != "$bun_target" ]]; then npm install -g "bun@$bun_target"; fi
      - run: pnpm install --frozen-lockfile
      - run: scripts/ci/just secrets
