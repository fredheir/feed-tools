name: secrets

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MARKOLO_SHARED_STANDARDS_REF: standards/stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    if: github.event_name != 'pull_request' || github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Configure private Git auth
        run: scripts/ci/configure-private-github-git
        env:
          GH_PRIVATE_REPO_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.14.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Bun for git-hosted slop-scan
        run: |
          bun_target=1.3.13
          if [[ "$(bun --version 2>/dev/null)" != "$bun_target" ]]; then npm install -g "bun@$bun_target"; fi
      - run: pnpm install --frozen-lockfile
      - run: |
          standards_dir="${RUNNER_TEMP}/markolo-shared-secrets"
          rm -rf "$standards_dir"
          git clone --depth 1 git@github.com:Markolo-Research/markolo-shared.git "$standards_dir"
          git -C "$standards_dir" fetch --depth 1 origin "$MARKOLO_SHARED_STANDARDS_REF"
          git -C "$standards_dir" checkout --detach FETCH_HEAD
      - run: scripts/guards/secrets
        env:
          REPO_STANDARDS_LOCAL: ${{ runner.temp }}/markolo-shared-secrets
