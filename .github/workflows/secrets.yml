name: secrets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MARKOLO_SHARED_STANDARDS_REF: standards/stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - markolo-hetzner
      - ci-light
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e # v6.0.3
        with:
          version: 10.14.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: |
          rm -rf /tmp/markolo-shared
          git clone --depth 1 git@github.com:Markolo-Research/markolo-shared.git /tmp/markolo-shared
          git -C /tmp/markolo-shared fetch --depth 1 origin "$MARKOLO_SHARED_STANDARDS_REF"
          git -C /tmp/markolo-shared checkout --detach "$MARKOLO_SHARED_STANDARDS_REF"
      - run: just secrets
        env:
          REPO_STANDARDS_LOCAL: /tmp/markolo-shared
