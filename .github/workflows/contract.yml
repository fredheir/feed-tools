name: contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MARKOLO_SHARED_STANDARDS_REF: standards/stable

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ${{ fromJSON(vars.MARKOLO_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Configure private Git auth
        run: scripts/ci/configure-private-github-git
        env:
          GH_PRIVATE_REPO_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      - uses: pnpm/action-setup@8912a9102ac27614460f54aedde9e1e7f9aec20d # v6.0.5
        with:
          version: 10.14.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: |
          standards_dir="${RUNNER_TEMP}/markolo-shared-contract"
          rm -rf "$standards_dir"
          git clone --depth 1 git@github.com:Markolo-Research/markolo-shared.git "$standards_dir"
          git -C "$standards_dir" fetch --depth 1 origin "$MARKOLO_SHARED_STANDARDS_REF"
          git -C "$standards_dir" checkout --detach FETCH_HEAD
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: |
          uv tool install apm-cli
          apm install --target agent-skills
      - run: scripts/guards/repo-contract
        env:
          REPO_STANDARDS_LOCAL: ${{ runner.temp }}/markolo-shared-contract
