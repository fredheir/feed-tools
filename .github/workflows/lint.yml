name: lint

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "assets/**"
      - "bin/**"
      - "lib/**"
      - "scripts/**"
      - "skills/**"
      - "sources/**"
      - "tests/**"
      - "*.config.*"
      - "justfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - ".github/workflows/lint.yml"
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "bin/**"
      - "lib/**"
      - "scripts/**"
      - "skills/**"
      - "sources/**"
      - "tests/**"
      - "*.config.*"
      - "justfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Safe Chain
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci
      - name: Install Bun for git-hosted slop-scan
        run: |
          bun_target=1.3.13
          if [[ "$(bun --version 2>/dev/null)" != "$bun_target" ]]; then npm install -g "bun@$bun_target"; fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
