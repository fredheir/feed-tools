name: tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "assets/**"
      - "bin/**"
      - "lib/**"
      - "scripts/**"
      - "sources/**"
      - "tests/**"
      - "*.config.*"
      - "justfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vitest.config.mts"
      - ".github/workflows/tests.yml"
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "bin/**"
      - "lib/**"
      - "scripts/**"
      - "sources/**"
      - "tests/**"
      - "*.config.*"
      - "justfile"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "vitest.config.mts"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.14.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Safe Chain
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/AikidoSec/safe-chain/releases/download/1.5.3/install-safe-chain.sh | sh -s -- --ci
      - name: Install Bun for git-hosted slop-scan
        run: |
          bun_target=1.3.13
          if [[ "$(bun --version 2>/dev/null)" != "$bun_target" ]]; then npm install -g "bun@$bun_target"; fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
