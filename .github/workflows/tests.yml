name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - markolo-hetzner
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
