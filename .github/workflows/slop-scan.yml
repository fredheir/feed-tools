name: slop-scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bin/**"
      - "lib/**"
      - "scripts/**"
      - "sources/**"
      - "tests/**"
      - "*.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "slop-scan.config.json"
      - ".github/workflows/slop-scan.yml"
  push:
    branches:
      - main
    paths:
      - "bin/**"
      - "lib/**"
      - "scripts/**"
      - "sources/**"
      - "tests/**"
      - "*.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "slop-scan.config.json"
      - ".github/workflows/slop-scan.yml"

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ratchet:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.14.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: head/pnpm-lock.yaml
      - name: Install Bun for git-hosted slop-scan
        run: |
          bun_target=1.3.13
          if [[ "$(bun --version 2>/dev/null)" != "$bun_target" ]]; then npm install -g "bun@$bun_target"; fi
      - run: pnpm install --frozen-lockfile
        working-directory: head
      - name: Detect ratchet bootstrap state
        id: bootstrap
        run: |
          if [ -f base/slop-scan.config.json ]; then
            echo "has_base_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_base_config=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Delta scan (fail on added or worsened slop)
        if: steps.bootstrap.outputs.has_base_config == 'true'
        working-directory: head
        run: pnpm exec slop-scan delta --base ../base --head . --fail-on added,worsened
      - name: Head scan only (base branch predates slop bootstrap)
        if: steps.bootstrap.outputs.has_base_config != 'true'
        working-directory: head
        run: |
          echo "Base branch does not contain slop-scan config yet; running informational head scan only."
          pnpm run slop:lint

  baseline:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.14.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Bun for git-hosted slop-scan
        run: |
          bun_target=1.3.13
          if [[ "$(bun --version 2>/dev/null)" != "$bun_target" ]]; then npm install -g "bun@$bun_target"; fi
      - run: pnpm install --frozen-lockfile
      - name: Scan default branch (informational baseline)
        run: pnpm run slop:lint
