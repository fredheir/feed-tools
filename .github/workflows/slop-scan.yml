name: slop-scan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bin/**"
      - "lib/**"
      - "scripts/**"
      - "sources/**"
      - "tests/**"
      - "*.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "slop-scan.config.json"
      - ".github/workflows/slop-scan.yml"
  push:
    branches:
      - main
    paths:
      - "bin/**"
      - "lib/**"
      - "scripts/**"
      - "sources/**"
      - "tests/**"
      - "*.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "slop-scan.config.json"
      - ".github/workflows/slop-scan.yml"

permissions:
  contents: read
  packages: read

env:
  MARKOLO_SHARED_STANDARDS_REF: 292e07694d059d9049744bb6ad0c078b15d3a491

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ratchet:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: head/pnpm-lock.yaml
      - name: Load shared repo standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Markolo-Research/markolo-shared
          ref: ${{ env.MARKOLO_SHARED_STANDARDS_REF }}
          path: head/.repo-standards/markolo-shared
          token: ${{ secrets.PACKAGES_TOKEN }}
          persist-credentials: false
      - name: Set shared repo standards path
        run: echo "REPO_STANDARDS_LOCAL=$GITHUB_WORKSPACE/head/.repo-standards/markolo-shared" >> "$GITHUB_ENV"
      - name: Install Safe Chain
        working-directory: head
        run: |
          scripts/guards/_repo-standards safe-chain-install
          git clean -ffdx -- .repo-standards
      - name: Install Bun for git-hosted slop-scan
        run: |
          bun_target=1.3.13
          if [[ "$(bun --version 2>/dev/null)" != "$bun_target" ]]; then npm install -g "bun@$bun_target"; fi
      - run: pnpm install --frozen-lockfile
        working-directory: head
      - name: Detect ratchet bootstrap state
        id: bootstrap
        run: |
          if [ -f base/slop-scan.config.json ]; then
            echo "has_base_config=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_base_config=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Delta scan (fail on added or worsened slop)
        if: steps.bootstrap.outputs.has_base_config == 'true'
        working-directory: head
        run: pnpm exec slop-scan delta --base ../base --head . --fail-on added,worsened
      - name: Head scan only (base branch predates slop bootstrap)
        if: steps.bootstrap.outputs.has_base_config != 'true'
        working-directory: head
        run: |
          echo "Base branch does not contain slop-scan config yet; running informational head scan only."
          scripts/ci/just slop-scan

  baseline:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SAFE_CHAIN_MINIMUM_PACKAGE_AGE_HOURS: "72"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Load shared repo standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Markolo-Research/markolo-shared
          ref: ${{ env.MARKOLO_SHARED_STANDARDS_REF }}
          path: .repo-standards/markolo-shared
          token: ${{ secrets.PACKAGES_TOKEN }}
          persist-credentials: false
      - name: Set shared repo standards path
        run: echo "REPO_STANDARDS_LOCAL=$GITHUB_WORKSPACE/.repo-standards/markolo-shared" >> "$GITHUB_ENV"
      - name: Install Safe Chain
        run: |
          scripts/guards/_repo-standards safe-chain-install
          git clean -ffdx -- .repo-standards
      - name: Install Bun for git-hosted slop-scan
        run: |
          bun_target=1.3.13
          if [[ "$(bun --version 2>/dev/null)" != "$bun_target" ]]; then npm install -g "bun@$bun_target"; fi
      - run: pnpm install --frozen-lockfile
      - name: Scan default branch (informational baseline)
        run: scripts/ci/just slop-scan
