name: actions-hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  actions-hygiene:
    runs-on:
      - self-hosted
      - Linux
      - X64
      - markolo-hetzner
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: actionlint
      - run: uvx zizmor --offline .github/workflows .github/dependabot.yml
