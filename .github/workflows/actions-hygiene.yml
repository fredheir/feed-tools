name: actions-hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MARKOLO_SHARED_STANDARDS_REF: standards/stable

jobs:
  actions-hygiene:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.MARKOLO_CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Load shared repo standards
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Markolo-Research/markolo-shared
          ref: ${{ env.MARKOLO_SHARED_STANDARDS_REF }}
          path: .repo-standards/markolo-shared
          token: ${{ secrets.PACKAGES_TOKEN }}
          persist-credentials: false

      - name: Set shared repo standards path
        run: echo "REPO_STANDARDS_LOCAL=$GITHUB_WORKSPACE/.repo-standards/markolo-shared" >> "$GITHUB_ENV"

      - name: Run actions hygiene
        run: scripts/ci/just actions-hygiene
