name: actions-hygiene

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MARKOLO_SHARED_STANDARDS_REF: standards/stable

jobs:
  actions-hygiene:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26

      - name: Setup uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Load shared repo standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Markolo-Research/markolo-shared
          ref: ${{ env.MARKOLO_SHARED_STANDARDS_REF }}
          path: .repo-standards/markolo-shared
          token: ${{ secrets.PACKAGES_TOKEN }}
          persist-credentials: false

      - name: Set shared repo standards path
        run: echo "REPO_STANDARDS_LOCAL=$GITHUB_WORKSPACE/.repo-standards/markolo-shared" >> "$GITHUB_ENV"

      - name: Run actions hygiene
        run: scripts/ci/just actions-hygiene
